<!DOCTYPE html>  <!-- 문서 유형 선언: 이 문서가 HTML5 문서임을 브라우저에게 알려줌 -->
<html lang="en">       <!-- html 태그: 전체 문서의 시작, lang 속성으로 문서의 기본 언어를 지정 (en = 영어) -->
<head>
    <meta charset="UTF-8">  <!-- 문자 인코딩을 UTF-8로 설정 (한글, 특수문자 깨짐 방지) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- 모바일 화면 대응을 위한 뷰포트 설정 -->
    <title>Document</title>  <!-- 브라우저 탭에 표시될 문서 제목 -->
</head>
<body>
    <h1>HTML이란?</h1>  <!-- 큰 제목(heading 1) 태그 -->
    HyperText markUP LANGUAGE의 약어  <!-- 본문 텍스트 -->
</body>
</html>
