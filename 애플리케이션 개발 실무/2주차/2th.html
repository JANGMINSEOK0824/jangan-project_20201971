<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
     <title>미디어 쿼리 정의</title>
  <style>
    /* 기본 (중간 너비): 흰 배경 */
    body { background-color: white; color: black; }

    /* (1) 창 너비 400px 이하: 초록 */
    @media screen and (max-width: 400px) {
      body { background-color: #77a83f; color: white; }
    }

    /* (3) 창 너비 700px 이상: 보라 */
    @media screen and (min-width: 700px) {
      body { background-color: #6553a8; color: white; }
    }
  </style>
</head>
<body>
  <h1>미디어 쿼리</h1>
  <p>반응형 웹에 대한 예</p>
</body>
</html>
